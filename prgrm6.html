
<html>
<head>
<title>JavaScript String and Math Objects</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: lavendar;
}
h1, h2 {
    color: #2874a6;
}
input {
    padding: 8px;
    width: 250px;
    border: 1px solid #aaa;
    border-radius: 5px;
    margin: 10px;
}
button {
    background-color: #2874a6;
    color: white;
    padding: 9px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: #154360;
}
hr {
    border: 1px solid #ccc;
    margin-top: 25px;
}
</style>
</head>

<body>

<center>
<h1><u>String and Math Object Functions</u></h1>
</center>
<h2>1. String Object Functions</h2>
Enter Original String:
<input type="text" id="str"><br>
Enter String to Replace:
<input type="text" id="replaceStr"><br>
Enter String to Concatenate:
<input type="text" id="concatStr"><br>
Enter String to Find:
<input type="text" id="search"><br>
<button onclick="stringFunctions()">Submit</button>
<p id="stringResult"></p>
<script>
function stringFunctions()
{
    var str = document.getElementById("str").value;
    var replaceStr = document.getElementById("replaceStr").value;
    var concatStr = document.getElementById("concatStr").value;
    var search = document.getElementById("search").value;
    var result = "<b>Original String = </b>" + str + "<br><br>";

    result += "1. Length: " + str.length + "<br>";
    result += "2. Uppercase: " + str.toUpperCase() + "<br>";
    result += "3. Lowercase: " + str.toLowerCase() + "<br>";
    result += "4. Character at position 1: " + str.charAt(1) + "<br>";
    result += "5. Index of searched string: " + str.indexOf(search) + "<br>";
    result += "6. Slice [0,5]: " + str.slice(0,5) + "<br>";
    result += "7. Replace: " + str.replace(str.slice(0,6), replaceStr) + "<br>";
    result += "8. Concatenation: " + str.concat(concatStr) + "<br>";
    result += "9. Trim: " + (" " + str + " ").trim() + "<br>";
    document.getElementById("stringResult").innerHTML = result;
}
</script>
<hr>
<h2>2. Math Object Functions</h2>
Enter First Number:
<input type="number" id="num1" step="any"><br>
Enter Second Number:
<input type="number" id="num2" step="any"><br>
<button onclick="mathFunctions()">Submit</button>
<p id="mathResult"></p>
<script>
function mathFunctions()
{
    var num1 = Number(document.getElementById("num1").value);
    var num2 = Number(document.getElementById("num2").value);
    var result = "<b>First Number = </b>" + num1 + "<br>";
    result += "<b>Second Number = </b>" + num2 + "<br><br>";

    result += "1. Absolute Value: " + Math.abs(num2) + "<br>";
    result += "2. Round: " + Math.round(num1) + "<br>";
    result += "3. Ceil: " + Math.ceil(num1) + "<br>";
    result += "4. Floor: " + Math.floor(num1) + "<br>";
    result += "5. Square Root: " + Math.sqrt(num1) + "<br>";
    result += "6. Power to 3: " + Math.pow(num1, 3) + "<br>";
    result += "7. Maximum: " + Math.max(num1, num2) + "<br>";
    result += "8. Minimum: " + Math.min(num1, num2) + "<br>";
    result += "9. Random Number: " + Math.random() + "<br>";
    result += "10. PI Value: " + Math.PI + "<br>";
    document.getElementById("mathResult").innerHTML = result;
}
</script>
</body>
</html>
