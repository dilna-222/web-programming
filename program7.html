<html>
<head>
<title>Simple Calendar</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #ffe4ec;
    text-align: center;
    padding: 20px;
}
h2 {
    color: #c2185b;
}
input {
    padding: 8px;
    border: 1px solid #e91e63;
    border-radius: 5px;
}
button {
    padding: 8px 15px;
    background-color: #e91e63;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: #ad1457;
}
#calendar {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 15px;
}
table {
    border-collapse: collapse;
    margin-bottom: 10px;
    background-color: white;
    box-shadow: 0 2px 6px #e5b5c8;
}
th, td {
    padding: 7px;
    text-align: center;
    border: 1px solid #f3c1d2;
}
th {
    background-color: #f8bbd0;
    color: #880e4f;
}
</style>
</head>
<body>
<h2>Generate Calendar for a year</h2>
<p>Enter the year:</p>
<input type="number" id ="yearInput" placeholder="Enter year"/>
<button onclick="generateCalendar()">Generate Calendar</button>
<div id="calendar"></div>
<script>
function generateCalendar(){
const year=document.getElementById("yearInput").value;
if(!year||isNaN(year)||year<1000 ||year>9999){
alert("Please enter a valid year between 1000 and 9999.");
return;
}
const CalendarDiv=document.getElementById("calendar");
CalendarDiv.innerHTML=' ';
const months=[
"January","February","March","April","May","June","July","August","September","October","November","December"
];

for(let month=0; month<12; month++){
let Month=`<table border="1"><tr><th colspan="7"><strong>
${months[month]} </strong></th></tr>`;
Month +='<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>';

const firstDay=new Date(year,month,1).getDay();
const daysInMonth=new Date(year,month+1,0).getDate();
let dayCounter=1;

for(let i=0;i<6;i++){
let row='<tr>';
for(let j=0;j<7;j++){
if(i==0 && j<firstDay){
row += '<td></td>';
}else if (dayCounter<=daysInMonth){
row+=`<td>${dayCounter}</td>`;
dayCounter++;

}else{
row+='<td></td>';
}
}
row+='</tr>';
Month +=row;
if(dayCounter>daysInMonth) break;
}
Month +='</table>';
CalendarDiv.innerHTML+=Month;
}
}
</script>
</body>
</html>
